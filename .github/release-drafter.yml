name-template: 'v$RESOLVED_VERSION 🌈'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features' 
    labels:
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
  - title: '📖 Documentation'
    labels:
      - 'documentation'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

template: |
  ## Changes

  $CHANGES

autolabeler:
  - label: 'enhancement'
    branch:
      - '/^feat(ure)?[/-].+/'
  - label: 'bug'
    branch:
      - '/^fix[/-].+/'
      - '/^hotfix[/-].+/'
  - label: 'documentation'
    branch:
      - '/^doc(s)?[/-].+/'
  - label: 'test'
    branch:
      - '/^test[/-].+/'
  - label: 'refactor'
    branch:
      - '/^refactor[/-].+/'