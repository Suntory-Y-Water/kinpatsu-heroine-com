name: Create Release on Main Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # PRがマージされ、かつマージ元のブランチが 'release' で始まる場合のみ実行
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # release-drafter が全てのコミット履歴を解析できるようにするため
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from package.json
        id: package_version
        run: |
          # package.json からバージョンを読み取り、出力変数に設定
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create Release Tag and Note
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # package.jsonから取得した純粋なバージョン番号を渡す
          version: ${{ steps.package_version.outputs.version }}
          publish: true # リリースを自動公開
          config-name: release-drafter.yml