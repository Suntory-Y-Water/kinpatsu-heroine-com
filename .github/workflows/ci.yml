# .github/workflows/ci.yml
name: CI

on:
  workflow_dispatch:
  push:
    branches: 
      - 'feature-*'
      - 'feature/*'
    paths: ['**/*.ts', '**/*.tsx', '**/*.js', '.github/**']

jobs:
  ci:
    uses: Suntory-Y-Water/my-github-actions-ci/.github/workflows/ci.yml@main
    with:
      enable-actionlint: true
      enable-build: true
      enable-lint: true
      enable-test: true
      node-version: '20'
      pnpm-version: '9'