name: CI

on:
  workflow_dispatch:
  push:
    branches: 
      - 'feature-*'
      - 'feature/*'
    paths: ['**/*.ts', '**/*.tsx', '**/*.js', '.github/**']

jobs:
  ci:
    uses: Suntory-Y-Water/my-github-actions-ci/.github/workflows/ci.yml@main
    with:
      # actionlintを実行するか
      enable-actionlint: true
      # ビルドを実行するか  
      enable-build: true
      # リントを実行するか
      enable-lint: true
      # テストを実行するか
      enable-test: true
      # Node.jsバージョン
      node-version: '20'
      # pnpmバージョン
      pnpm-version: '9'