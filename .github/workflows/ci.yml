name: CI

on:
  workflow_dispatch:
  push:
    branches: 
      - 'feature-*'
      - 'feature/*'
    paths: ['**/*.ts', '**/*.tsx', '**/*.js', '.github/**', '**/*.json']

defaults:
  run:
    shell: bash

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run actionlint
        run: docker run --rm -v "$(pwd):$(pwd)" -w "$(pwd)" rhysd/actionlint:1.7.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: check version, post comments
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const { readFileSync } = require('fs');
            
            // mainブランチとのバージョン比較
            const baseVersion = execSync('git show origin/main:package.json').toString();
            const currentPackage = readFileSync('package.json', 'utf8');
            
            const baseVersionNum = JSON.parse(baseVersion).version;
            const currentVersionNum = JSON.parse(currentPackage).version;
            
            console.log(`Main branch version: ${baseVersionNum}`);
            console.log(`Current branch version: ${currentVersionNum}`);
            
            // バージョンが同じ場合のみ警告処理を実行
            if (baseVersionNum !== currentVersionNum) {
              console.log('バージョンが更新されています。警告は不要です。');
              return;
            }
            
            // 現在のブランチ名を取得
            const branchName = context.ref.replace('refs/heads/', '');
            
            // プルリクエストを検索
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branchName}`,
              state: 'open'
            });
            
            console.log(`検索条件: ${context.repo.owner}/${context.repo.repo} ブランチ: ${branchName}`);
            console.log(`見つかったプルリクエスト数: ${pulls.length}`);
            
            if (pulls.length === 0) {
              console.log('対応するプルリクエストが見つかりません');
              return;
            }

            const pr = pulls[0];
            
            // 既存のコメントをチェック（同じ警告の重複を防ぐ）
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });
            
            const hasVersionWarning = comments.some(comment => 
              comment.body.includes('⚠️ **package.jsonのバージョンが更新されていません**') &&
              comment.user.type === 'Bot'
            );
            
            if (hasVersionWarning) {
              console.log('既にバージョン警告コメントが存在します');
              return;
            }
            
            // このブランチで既にバージョンが上がったことがあるかチェック
            const commits = execSync(`git log origin/main..HEAD --oneline --grep="version"`).toString();
            const hasVersionCommit = commits.includes('version') || 
                                   execSync(`git log origin/main..HEAD --oneline`).toString().includes('bump') ||
                                   execSync(`git log origin/main..HEAD --name-only`).toString().includes('package.json');
            
            if (hasVersionCommit) {
              // このブランチで過去にpackage.jsonが変更されている場合、
              // 最新のコミットでバージョンが戻されていないかチェック
              const gitLog = execSync(`git log origin/main..HEAD --oneline --follow -- package.json`).toString().trim();
              if (gitLog) {
                console.log('このブランチで既にpackage.jsonが変更されています。警告をスキップします。');
                return;
              }
            }
            
            console.log(`プルリクエスト #${pr.number} にコメントを投稿します`);
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `⚠️ **package.jsonのバージョンが更新されていません**\n\n現在のバージョン: \`${currentVersionNum}\`\nmainブランチのバージョン: \`${baseVersionNum}\`\n\nバージョンアップをお願いします。`
            });
            
            console.log(`プルリクエスト #${pr.number} にコメントを投稿しました`);