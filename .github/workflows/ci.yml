name: CI

on:
  # feature-またはfeature/で始まるPRでのみ実行する
  pull_request:
    branches: 
      - 'feature-*'
      - 'feature/*'

jobs:
  build-type:
    name: Run Build and TypeScript lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Build
        run: pnpm run build

      - name: Run Lint
        run: pnpm run lint